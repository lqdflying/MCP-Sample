[project]
name = "mcp-auth-sample"
version = "0.2.0"
description = "FastMCP server with production-ready authentication, RBAC, MFA, and token management"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.3.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "aiomysql>=0.2.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.0.0",
    "pyotp>=2.9.0",
    "segno>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no external services required)",
    "e2e: End-to-end tests (requires running server)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# load_dotenv() runs before FastMCP import so FASTMCP_* env applies at import time.
"server.py" = ["E402"]
